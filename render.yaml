services:
  - type: web
    name: the-power-gym
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: thepowergym-db
          property: connectionString
      - key: STAFF_ACCESS_KEY
        value: ASDFGF123456*

databases:
  - name: thepowergym-db
    databaseName: thepowergym
    user: powergym_user
    plan: free
